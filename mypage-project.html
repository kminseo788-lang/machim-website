<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>마이페이지 | 1마침</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/common.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="js/site-config.js"></script>

<style>
  body{font-family:"Noto Sans KR",sans-serif;background:var(--paper);}
  .wrap{width:min(640px, calc(100% - 40px));margin:0 auto;padding:50px 0 100px;}
  .top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
  .top-row h1{font-size:20px;}
  .logout-btn{font-size:13px;color:var(--ink-soft);}
  .logout-btn:hover{color:var(--brick);}

  .card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:30px;margin-bottom:20px;}
  .card h2{font-size:15px;margin-bottom:18px;color:var(--ink-soft);font-weight:700;}
  .proj-name{font-size:19px;font-weight:800;margin-bottom:4px;}
  .proj-amount{font-size:13.5px;color:var(--ink-soft);margin-bottom:0;}

  .timeline{list-style:none;}
  .timeline li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;font-size:14px;}
  .timeline .mark{flex-shrink:0;width:20px;text-align:center;font-weight:800;}
  .timeline li.done .mark{color:var(--green);}
  .timeline li.current .mark{color:var(--brick);}
  .timeline li.pending .mark{color:var(--ink-faint);}
  .timeline li.pending{color:var(--ink-faint);}
  .timeline .date{color:var(--ink-faint);font-size:12.5px;margin-right:4px;}

  .action-box{border-top:1.5px dashed var(--line);margin-top:10px;padding-top:20px;}
  .action-box p.desc{font-size:13.5px;color:var(--ink-soft);margin-bottom:14px;white-space:pre-line;}
  .action-box a.view-link{display:inline-block;margin-bottom:14px;font-size:13.5px;color:var(--brick);text-decoration:underline;}

  textarea{
    width:100%;min-height:90px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;
    background:#fff;font:inherit;color:var(--ink);outline:none;resize:vertical;margin-bottom:10px;
  }
  textarea:focus{border-color:var(--brick);}

  .btn-row{display:flex;gap:10px;}
  .btn{padding:12px 18px;border-radius:10px;font-size:14px;font-weight:700;}
  .btn-primary{background:var(--brick);color:#fff;}
  .btn-primary:hover{background:var(--brick-dark);}
  .btn-ghost{background:var(--paper);color:var(--ink-soft);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink-soft);}
  .btn:disabled{opacity:.6;}

  .brief-box{background:var(--paper);border-radius:10px;padding:16px 18px;margin-bottom:14px;font-size:13.5px;line-height:1.7;}
  .brief-box div{margin-bottom:4px;}
  .brief-box b{color:var(--ink-soft);margin-right:6px;}

  .msg{font-size:13px;margin-top:12px;padding:10px 12px;border-radius:8px;display:none;}
  .msg.err{display:block;background:#FBEAE6;color:var(--brick-dark);}
  .msg.ok{display:block;background:#EAF2EA;color:var(--green);}

  .empty{text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:14px;}
  .center-loading{text-align:center;padding:80px 20px;color:var(--ink-faint);font-size:13.5px;}

  .chat-list{max-height:420px;overflow-y:auto;padding:4px 2px;margin-bottom:12px;}
  .chat-empty{text-align:center;color:var(--ink-faint);font-size:13.5px;padding:26px 10px;line-height:1.7;}
  .bub-row{display:flex;flex-direction:column;margin:10px 0;}
  .bub-row.me{align-items:flex-end;}
  .bub-row.admin{align-items:flex-start;}
  .bub{max-width:88%;padding:11px 14px;border-radius:14px;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word;}
  .bub-row.me .bub{background:var(--brick);color:#fff;border-bottom-right-radius:4px;}
  .bub-row.admin .bub{background:#fff;border:1.5px solid var(--line);border-bottom-left-radius:4px;}
  .bub-meta{font-size:11.5px;color:var(--ink-faint);margin:3px 4px 0;}
  .bub-tag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--brick);background:#fdf1ec;border-radius:6px;padding:2px 8px;margin-bottom:4px;}
  .chat-notice{font-size:12.8px;color:var(--ink-soft);background:var(--paper);border-radius:10px;padding:11px 14px;line-height:1.65;margin-bottom:14px;}
  .reply-banner{display:block;margin-bottom:16px;padding:14px 18px;border-radius:12px;background:var(--brick);color:#fff;font-weight:800;font-size:15px;text-align:center;text-decoration:none;box-shadow:0 8px 20px rgba(217,119,87,.28);}
</style>
</head>
<body>

<header>
  <div class="nav">
    <a href="index.html" class="logo">1<span class="mark">마침</span></a>
    <a href="index.html" class="back-link">← 메인으로</a>
  </div>
</header>

<div class="wrap">
  <div class="top-row">
    <h1>마이페이지</h1>
    <a href="#" class="logout-btn" id="logoutBtn">로그아웃</a>
  </div>

  <div id="replyBanner"></div>
  <div id="inqBox"></div>
  <div id="content">
    <div class="center-loading">불러오는 중…</div>
  </div>
  <div id="chatBox"></div>
</div>

<script>
  const STAGE_ORDER = ['자료제출대기','방향서대기','방향서승인대기','프로토타입대기','프로토타입승인대기','개발중','최종확인대기','배포완료'];

  const HOSTING_ACK_TEXT = '배포 서비스는 Cloudflare Pages 한 가지로 통일되며, 호스팅·도메인의 요금제·약관·사용 한도 초과 요금·갱신 비용은 제가 직접 책임진다는 점을 확인했습니다. 다른 서비스를 원할 경우 결제 전에 문의해야 하고, 결제 후 변경·이전은 유료 유지보수임을 이해했습니다.';

  const MAX_FILES = 10;
  const MAX_FILE_BYTES = 10 * 1024 * 1024;

  // 큰 사진(JPEG/WebP)은 올리기 전에 자동으로 줄여서 용량을 아낍니다. (PNG/문서는 그대로)
  function isCompressible(f){ return f.type === 'image/jpeg' || f.type === 'image/webp'; }
  async function maybeCompress(f){
    if(!isCompressible(f) || f.size < 1.5 * 1024 * 1024) return f;
    const bmp = await createImageBitmap(f);
    const maxSide = 2400;
    const ratio = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * ratio); c.height = Math.round(bmp.height * ratio);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.85));
    return (blob && blob.size < f.size) ? new File([blob], f.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' }) : f;
  }

  async function sha256Hex(file){
    const buf = await file.arrayBuffer();
    const h = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  let project = null;
  let allProjects = [];
  const NEED_ME = ['자료제출대기','방향서승인대기','프로토타입승인대기','최종확인대기'];

  (async function init(){
    const { data: { session } } = await sb.auth.getSession();
    if(!session){ location.href = 'mypage-login.html'; return; }

    const { data: { user } } = await sb.auth.getUser();
    loadInquiries(user);

    // 혹시 아직 claim 안 된 프로젝트가 있으면 연결 시도
    await sb.from('machim_projects')
      .update({ customer_id: user.id })
      .is('customer_id', null)
      .ilike('customer_email', user.email);

    const { data, error } = await sb.from('machim_projects')
      .select('*')
      .eq('customer_id', user.id)
      .order('created_at', { ascending: false });

    if(error){
      document.getElementById('content').innerHTML = '<div class="empty">프로젝트를 불러오지 못했어요. 새로고침해보시거나 문의해주세요.</div>';
      return;
    }

    if(!data || data.length === 0){
      document.getElementById('content').innerHTML = '<div class="empty">아직 연결된 프로젝트가 없어요.<br>결제가 확인되면 이 화면에 자료 제출 단계가 열립니다.<br>주문하신 이메일과 로그인한 이메일이 같은지도 확인해주세요.</div>';
      return;
    }

    allProjects = data;
    initChat(user);
    // 열 프로젝트 선택: 주소의 ?id= → 고객 확인이 필요한 것 → 최신
    const wantId = new URLSearchParams(location.search).get('id');
    project = data.find(x => x.id === wantId) || data.find(x => NEED_ME.includes(x.current_stage)) || data[0];
    render();
  })();

  document.getElementById('logoutBtn').addEventListener('click', async (e)=>{
    e.preventDefault();
    await sb.auth.signOut();
    location.href = 'mypage-login.html';
  });


  async function loadInquiries(u){
    try{
      const { data } = await sb.from('machim_inquiries').select('*').eq('customer_id', u.id).order('created_at', { ascending:false });
      const box = document.getElementById('inqBox');
      if(!data || !data.length){ box.innerHTML = ''; return; }
      box.innerHTML = '<div class="card"><h2>서버·결제 전 문의 (' + data.length + ')</h2>' + data.map(function(q){
        const d = new Date(q.created_at);
        const when = (d.getMonth()+1) + '.' + d.getDate();
        const replied = !!(q.admin_reply && q.admin_reply.trim());
        let pay = '';
        if(replied && q.payable && q.product_key){
          pay = '<a href="order.html?p=' + encodeURIComponent(q.product_key) + '&inq=' + encodeURIComponent(q.id) + '" style="display:inline-block;margin-top:10px;padding:11px 18px;border-radius:10px;background:var(--brick);color:#fff;font-weight:700;text-decoration:none;">이 조건으로 결제하기</a>';
        }
        if(replied && q.product_key){
          const base = 'order.html?p=' + encodeURIComponent(q.product_key);
          pay += q.payable
            ? ' <a href="' + base + '" style="display:inline-block;margin-top:10px;margin-left:6px;padding:10px 16px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-weight:600;text-decoration:none;font-size:13.5px;">기본 서비스로 결제하기</a>'
            : '<a href="' + base + '" style="display:inline-block;margin-top:10px;padding:11px 18px;border-radius:10px;background:var(--brick);color:#fff;font-weight:700;text-decoration:none;">기본 서비스로 결제하기</a>';
        }
        return '<div style="border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px;background:var(--paper);">' +
          '<div style="display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink-faint);"><span>' + when + ' 접수</span><b style="color:' + (replied ? 'var(--brick)' : 'var(--ink-faint)') + ';">' + (replied ? '답변 도착' : '확인 중') + '</b></div>' +
          '<div style="white-space:pre-wrap;font-size:13.5px;margin-top:8px;color:var(--ink-soft);">' + escapeHtml(q.scope || '') + '</div>' +
          (replied ? '<div style="margin-top:10px;padding:12px 14px;border-radius:10px;background:#fff;border:1.5px solid var(--brick);white-space:pre-wrap;font-size:14px;"><b>마침 답변</b><br>' + escapeHtml(q.admin_reply) + '</div>' + pay : '<div style="margin-top:8px;font-size:12.5px;color:var(--ink-faint);">평일 9시~18시에 확인하고 여기에 답변을 남겨드려요.</div>') +
          '</div>';
      }).join('') + '</div>';
    }catch(e){ console.error(e); }
  }


  // ================= 1:1 문의 (결제한 고객 전용, 고객 단위 대화) =================
  let chatUser = null, chatTag = null, chatProjectId = null, chatTimer = null, chatSeenKey = '', chatReadObs = null;
  const CHAT_NOTICE = '궁금한 점은 여기로 남겨주세요. <b>평일 9시~18시</b>에 확인하고 이곳에 답변을 남겨드려요. (18시 이후·주말·공휴일에 남기신 문의는 다음 영업일에 답변드려요.) 모든 문의와 답변은 이 화면에서만 진행돼요.';

  function chatProjectLabel(x){ return x.product_name + ' (#' + String(x.id).slice(0,4) + ')'; }

  function initChat(user){
    chatUser = user;
    const box = document.getElementById('chatBox');
    if(!box) return;
    let opts = '';
    if(allProjects.length > 1){
      opts = '<div style="margin-bottom:10px;font-size:13px;color:var(--ink-soft);">관련 프로젝트 (선택) <select id="chatProj" style="margin-left:6px;padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:13px;background:#fff;"><option value="">선택 안 함</option>' +
        allProjects.map(x => '<option value="' + x.id + '">' + escapeHtml(chatProjectLabel(x)) + '</option>').join('') + '</select></div>';
    }
    box.innerHTML = '<div class="card" id="chatCard"><h2>💬 1:1 문의</h2>' +
      '<div class="chat-notice">' + CHAT_NOTICE + '</div>' +
      '<div class="chat-list" id="chatList"><div class="chat-empty">불러오는 중…</div></div>' +
      '<div id="chatTagRow"></div>' + opts +
      '<textarea id="chatInput" placeholder="궁금한 점을 적어주세요. (비밀번호·인증번호는 적지 마세요)" style="min-height:90px;"></textarea>' +
      '<div class="btn-row"><button class="btn btn-primary" id="chatSend">보내기</button></div>' +
      '<div class="msg" id="chatMsg"></div></div>';
    document.getElementById('chatSend').addEventListener('click', sendChat);
    document.getElementById('chatInput').addEventListener('keydown', e => { if((e.ctrlKey || e.metaKey) && e.key === 'Enter') sendChat(); });
    // 예전 링크(contact.html?kind=deploy)로 들어온 경우 미리 채움
    try{
      const pre = sessionStorage.getItem('machim_chat_prefill');
      if(pre){ sessionStorage.removeItem('machim_chat_prefill'); const o = JSON.parse(pre); openChatWith(o.msg, o.tag, o.pid, true); }
    }catch(e){}
    loadChat(true);
    chatTimer = setInterval(()=>{ if(!document.hidden) loadChat(false); }, 30000);
  }

  function renderChatTag(){
    const row = document.getElementById('chatTagRow');
    if(!row) return;
    row.innerHTML = chatTag
      ? '<div style="margin-bottom:8px;font-size:12.8px;"><span class="bub-tag">' + escapeHtml(chatTag) + '</span> <button type="button" id="chatTagX" style="border:none;background:none;color:var(--ink-faint);cursor:pointer;font-size:12.5px;">꼬리표 빼기 ✕</button></div>'
      : '';
    const x = document.getElementById('chatTagX');
    if(x) x.addEventListener('click', ()=>{ chatTag = null; renderChatTag(); });
  }

  function openChatWith(text, tag, pid, silent){
    const input = document.getElementById('chatInput');
    if(!input) return;
    input.value = text || '';
    chatTag = tag || null; chatProjectId = pid || null;
    renderChatTag();
    const sel = document.getElementById('chatProj');
    if(sel && pid) sel.value = pid;
    if(!silent){ document.getElementById('chatCard').scrollIntoView({ behavior:'smooth', block:'center' }); }
    input.focus();
  }

  async function loadChat(first){
    const list = document.getElementById('chatList');
    if(!list || !chatUser) return;
    const { data: msgs, error } = await sb.from('machim_messages').select('*').eq('customer_id', chatUser.id).order('created_at', { ascending:true });
    if(error){ if(first) list.innerHTML = '<div class="chat-empty">문의 내역을 불러오지 못했어요. 새로고침해 주세요.</div>'; console.error(error); return; }
    const { data: thr } = await sb.from('machim_threads').select('customer_last_read_at').eq('customer_id', chatUser.id).maybeSingle();
    const lastRead = thr && thr.customer_last_read_at ? new Date(thr.customer_last_read_at) : new Date(0);
    const unread = (msgs || []).filter(m => m.sender === 'admin' && new Date(m.created_at) > lastRead).length;

    const key = (msgs || []).length + ':' + ((msgs || []).slice(-1)[0] || {}).id;
    if(key !== chatSeenKey){
      chatSeenKey = key;
      if(!msgs.length){
        list.innerHTML = '<div class="chat-empty">아직 주고받은 문의가 없어요.<br>궁금한 점이 있으면 아래에 편하게 남겨주세요.</div>';
      } else {
        const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 80;
        list.innerHTML = msgs.map(m => {
          const mine = m.sender === 'customer';
          return '<div class="bub-row ' + (mine ? 'me' : 'admin') + '">' +
            (m.tag ? '<span class="bub-tag">' + escapeHtml(m.tag) + '</span>' : '') +
            '<div class="bub">' + escapeHtml(m.body) + '</div>' +
            '<div class="bub-meta">' + (mine ? '내가 보냄' : '마침 답변') + ' · ' + fmtDateTime(m.created_at) + '</div></div>';
        }).join('');
        if(first || nearBottom) list.scrollTop = list.scrollHeight;
      }
    }

    // 새 답변 알림 배너 + 읽음 처리 (화면에 보일 때)
    const banner = document.getElementById('replyBanner');
    if(banner){
      banner.innerHTML = unread > 0 ? '<a class="reply-banner" href="#chatCard" id="replyBannerA">💬 1:1 문의에 새 답변이 도착했어요 (' + unread + ')</a>' : '';
      const a = document.getElementById('replyBannerA');
      if(a) a.addEventListener('click', e => { e.preventDefault(); document.getElementById('chatCard').scrollIntoView({ behavior:'smooth', block:'center' }); });
    }
    if(unread > 0 && !chatReadObs && 'IntersectionObserver' in window){
      chatReadObs = new IntersectionObserver(async (ents) => {
        if(ents.some(en => en.isIntersecting)){
          await sb.rpc('machim_mark_read');
          chatReadObs.disconnect(); chatReadObs = null;
          const b = document.getElementById('replyBanner'); if(b) b.innerHTML = '';
        }
      }, { threshold: 0.4 });
      chatReadObs.observe(document.getElementById('chatCard'));
    }
  }

  async function sendChat(){
    const input = document.getElementById('chatInput');
    const btn = document.getElementById('chatSend');
    const m = document.getElementById('chatMsg');
    const body = input.value.trim();
    if(!body){ m.className = 'msg err'; m.textContent = '내용을 적어주세요.'; return; }
    if(body.length > 4000){ m.className = 'msg err'; m.textContent = '4000자 이내로 적어주세요.'; return; }
    btn.disabled = true; btn.textContent = '보내는 중…';
    const sel = document.getElementById('chatProj');
    const pid = (sel && sel.value) || chatProjectId || null;
    let tag = chatTag;
    if(!tag && sel && sel.value){ const px = allProjects.find(x => x.id === sel.value); if(px) tag = chatProjectLabel(px) + ' 관련'; }
    const { error } = await sb.from('machim_messages').insert({ customer_id: chatUser.id, sender: 'customer', body: body, tag: tag, project_id: pid });
    btn.disabled = false; btn.textContent = '보내기';
    if(error){
      console.error(error);
      m.className = 'msg err';
      m.textContent = '보내지 못했어요. 잠시 후 다시 시도해 주세요. (' + (error.message || '') + ')';
      return;
    }
    input.value = ''; chatTag = null; chatProjectId = null; renderChatTag();
    m.className = 'msg ok'; m.textContent = '보냈어요. 평일 9시~18시에 확인하고 이곳에 답변을 남겨드릴게요.';
    chatSeenKey = '';
    await loadChat(true);
    setTimeout(()=>{ m.className = 'msg'; }, 6000);
  }


  // 단계 화면에서 쓴 메모/수정요청을 1:1 문의(증빙 포함)로 전달
  async function sendStageNote(tag, text){
    const { error } = await sb.from('machim_messages').insert({
      customer_id: chatUser.id, sender: 'customer', body: text,
      tag: tag + ' · ' + project.product_name + ' (#' + String(project.id).slice(0,4) + ')', project_id: project.id
    });
    if(error){ console.error(error); return error; }
    chatSeenKey = ''; try{ loadChat(true); }catch(e){}
    return null;
  }

  const PREP_STAGES = ['개발중','최종확인대기','배포완료'];

  function fmtDateTime(iso){
    if(!iso) return '';
    const d = new Date(iso);
    return (d.getMonth()+1) + '.' + d.getDate() + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  function fmtDate(iso){
    if(!iso) return '';
    const d = new Date(iso);
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    return `${mm}.${dd}`;
  }

  function render(){
    const el = document.getElementById('content');
    const idx = STAGE_ORDER.indexOf(project.current_stage);

    const steps = [
      { key:'결제완료', label:'결제 완료', date: project.payment_confirmed_at, doneIf: true },
      { key:'자료제출', label:'제작자료 제출', date: project.material_submitted_at, doneAt: idx >= 1 },
      { key:'방향승인', label:'제작방향 승인', date: project.direction_approved_at, doneAt: idx >= 3 },
      { key:'시안승인', label:'프로토타입 승인', date: project.prototype_approved_at, doneAt: idx >= 5 },
      { key:'개발중', label:'개발', date: project.dev_completed_at, doneAt: idx >= 6, currentIf: idx === 5 },
      { key:'최종확인', label:'최종 확인', date: project.final_approved_at, doneAt: idx >= 7, currentIf: idx === 6 },
      { key:'배포', label:'배포', date: project.deployed_at, doneAt: !!project.deployed_at, currentIf: idx === 7 && !project.deployed_at },
    ];

    let timelineHtml = '';
    steps.forEach(s=>{
      let cls = 'pending', mark = '○';
      if(s.doneIf || s.doneAt){ cls='done'; mark='✓'; }
      else if(s.currentIf){ cls='current'; mark='●'; }
      timelineHtml += `<li class="${cls}"><span class="mark">${mark}</span><span>${s.date && (cls==='done') ? `<span class="date">${fmtDate(s.date)}</span>`:''}${s.label}</span></li>`;
    });

    let switcherHtml = '';
    if(allProjects.length > 1){
      switcherHtml = '<div class="card" style="padding:18px 20px;"><h2 style="margin-bottom:10px;">내 프로젝트 (' + allProjects.length + ')</h2>' +
        allProjects.map(x => {
          const need = NEED_ME.includes(x.current_stage);
          const on = x.id === project.id;
          return '<button type="button" data-pid="' + x.id + '" style="display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:11px 14px;margin-bottom:8px;border-radius:10px;border:1.5px solid ' + (on ? 'var(--brick)' : 'var(--line)') + ';background:' + (on ? '#fff' : 'var(--paper)') + ';font:inherit;cursor:pointer;">' +
            '<span style="font-weight:' + (on ? '800' : '600') + ';">' + escapeHtml(x.product_name) + '<span style="font-weight:500;font-size:12px;color:var(--ink-faint);margin-left:8px;">' + fmtDateTime(x.payment_confirmed_at || x.created_at) + ' 결제</span></span>' +
            '<span style="font-size:12px;white-space:nowrap;color:' + ((need || needsPrep(x)) ? 'var(--brick)' : 'var(--ink-faint)') + ';font-weight:700;">' + (x.deployed_at ? '완료' : (need ? '확인 필요' : (needsPrep(x) ? '배포 준비 필요' : '진행 중'))) + '</span></button>';
        }).join('') + '</div>';
    }

    el.innerHTML = switcherHtml + `
      <div class="card">
        <div class="proj-name">${escapeHtml(project.product_name)}</div>
        <p class="proj-amount">${project.amount ? Number(project.amount).toLocaleString()+'원' : ''}</p>
      </div>
      <div id="prepBox"></div>
      <div class="card">
        <h2>현재 제작 단계</h2>
        <ul class="timeline">${timelineHtml}</ul>
        <div class="action-box" id="actionBox"></div>
      </div>
    `;

    el.querySelectorAll('[data-pid]').forEach(b => b.addEventListener('click', ()=>{
      project = allProjects.find(x => x.id === b.dataset.pid) || project;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }));

    renderPrepCard();
    renderAction();
  }

  async function fillDeliverFiles(stageTag){
    const el = document.getElementById('deliverFiles'); if(!el) return;
    const files = (project.deliver_files || []).filter(f => f.stage === stageTag);
    if(!files.length){ el.remove(); return; }
    const rows = [];
    for(const f of files){
      const { data } = await sb.storage.from('machim-materials').createSignedUrl(f.path, 3600);
      const size = f.size ? ' (' + (f.size/1024/1024).toFixed(1) + 'MB)' : '';
      rows.push(data ? '<div style="padding:4px 0;"><a class="view-link" href="' + data.signedUrl + '" target="_blank" rel="noopener">' + escapeHtml(f.name) + '</a>' + size + '</div>' : '<div>' + escapeHtml(f.name) + ' (열기 실패)</div>');
    }
    el.innerHTML = '<div style="margin:10px 0;"><div style="font-size:13px;color:var(--ink-soft);margin-bottom:4px;">첨부 파일</div>' + rows.join('') + '</div>';
  }

function normUrl(u){
  u = (u || '').trim();
  if(!u) return '';
  if(/^(javascript|data|vbscript):/i.test(u)) return '';
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u.replace(/^\/+/, '');
  return u;
}
  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

      box.innerHTML = `

        <div style="margin:4px 0 12px;">

          <input type="file" id="materialFiles" multiple style="font-size:13px;width:100%;">
          <div id="fileList" style="font-size:12.5px;color:var(--ink-soft);margin-top:6px;"></div>
        </div>
        <label style="display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-soft);margin:6px 0 14px;line-height:1.6;">
          <input type="checkbox" id="hostingAck" style="width:18px;height:18px;flex:0 0 18px;margin-top:2px;accent-color:var(--brick);">
          <span id="hostingAckText">${HOSTING_ACK_TEXT}</span>
        </label>
        <div class="btn-row">
          <button class="btn btn-primary" id="submitMaterial">제출하기</button>
        </div>
        <div class="msg" id="actionMsg"></div>
      `;
      // 파일을 고를 때마다 목록에 누적 (최대 MAX_FILES), 개별 삭제 가능
      let pickedFiles = [];
      const renderFileList = ()=>{
        document.getElementById('fileList').innerHTML = pickedFiles.map((f,i) =>
          '<div style="display:flex;gap:8px;align-items:center;padding:3px 0;">' +
          '<span style="flex:1;word-break:break-all;">' + escapeHtml(f.name) + ' (' + (f.size/1024/1024).toFixed(1) + 'MB)</span>' +
          '<button type="button" data-rm="' + i + '" style="border:1px solid var(--line,#ccc);background:#fff;border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer;">삭제</button></div>'
        ).join('') + (pickedFiles.length ? '<div style="margin-top:4px;">' + pickedFiles.length + '/' + MAX_FILES + '개 선택됨 · 파일 선택을 다시 누르면 추가돼요</div>' : '');
      };
      document.getElementById('fileList').addEventListener('click', (e)=>{
        const b = e.target.closest('[data-rm]'); if(!b) return;
        pickedFiles.splice(Number(b.dataset.rm), 1); renderFileList();
      });
      document.getElementById('materialFiles').addEventListener('change', (e)=>{
        const fl = Array.from(e.target.files || []);
        const skippedNames = [];
        fl.forEach(f=>{
          if(pickedFiles.some(x => x.name === f.name && x.size === f.size && x.lastModified === f.lastModified)) return;
          if(pickedFiles.length >= MAX_FILES){ skippedNames.push(f.name); return; }
          pickedFiles.push(f);
        });
        e.target.value = '';
        renderFileList();
        if(skippedNames.length){
          document.getElementById('fileList').insertAdjacentHTML('beforeend',
            '<div style="margin-top:8px;padding:10px 12px;border-radius:8px;background:#fdf1ec;color:#a4432a;line-height:1.6;">' +
            '첨부파일은 최대 ' + MAX_FILES + '개까지 올릴 수 있어서 아래 파일은 담기지 않았어요.<br>' +
            skippedNames.map(n => '· ' + escapeHtml(n)).join('<br>') +
            '<br>담긴 파일 중 필요 없는 걸 삭제하면 다시 추가할 수 있어요.</div>');
        }
      });
      document.getElementById('submitMaterial').addEventListener('click', async ()=>{
        const note = document.getElementById('materialInput').value.trim();
        const btn = document.getElementById('submitMaterial');
        if(!document.getElementById('hostingAck').checked){ showActionMsg('배포 서비스·요금제 안내를 확인하고 체크해주세요.'); return; }
        const picked = pickedFiles.slice();
        if(picked.length > MAX_FILES){ showActionMsg('첨부파일은 최대 ' + MAX_FILES + '개까지 올릴 수 있어요.'); return; }
        const tooBig = picked.find(f => f.size > MAX_FILE_BYTES && !isCompressible(f));
        if(tooBig){ showActionMsg('"' + tooBig.name + '" 파일이 10MB를 넘어요. 줄이거나 나눠서 올려주세요.'); return; }
        btn.disabled = true; btn.textContent = '파일 올리는 중…';
        const uploaded = [];
        for(const f0 of picked){
          let f = f0;
          try{ f = await maybeCompress(f0); }catch(e){ f = f0; }
          if(f.size > MAX_FILE_BYTES){ showActionMsg('"' + f0.name + '" 파일이 10MB를 넘어요. 줄이거나 나눠서 올려주세요.'); btn.disabled=false; btn.textContent='제출하기'; return; }
          const safeName = f0.name.replace(/[^a-zA-Z0-9._-]/g, '_').slice(-80) || 'file';
          const path = project.id + '/' + Date.now() + '-' + uploaded.length + '-' + safeName;
          const { error: upErr } = await sb.storage.from('machim-materials').upload(path, f, { contentType: f.type || 'application/octet-stream' });
          if(upErr){ showActionMsg('"' + f0.name + '" 업로드에 실패했어요. 다시 시도해주세요.'); btn.disabled=false; btn.textContent='제출하기'; return; }
          let digest = ''; try{ digest = await sha256Hex(f); }catch(e){}
          uploaded.push({ path, name: f0.name, size: f.size, sha256: digest });
        }
        btn.textContent = '제출 중…';
        const { error } = await sb.from('machim_projects').update({
          material_files: uploaded,
          material_note: note,
          hosting_ack_at: new Date().toISOString(),
          hosting_ack_text: document.getElementById('hostingAckText').textContent.trim(),
          material_submitted_at: new Date().toISOString(),
          current_stage: '방향서대기'
        }).eq('id', project.id);
        if(error){ showActionMsg('제출 중 오류가 발생했어요. 다시 시도해주세요.'); btn.disabled=false; btn.textContent='제출하기'; return; }
        location.href = 'mypage-project.html?id=' + project.id;
      });
    }

    else if(stage === '방향서대기'){
      box.innerHTML = `<p class="desc">제작자료 제출이 완료되었습니다.\n확인 후 제작방향서를 보내드릴게요. 조금만 기다려주세요.</p>`;
    }

    else if(stage === '방향서승인대기'){
      const b = project.direction_brief || {};
      const BRIEF_LABELS = [['purpose','목적·대상'],['pages','페이지 구성'],['features','들어가는 기능'],['color','색상/디자인 톤'],['images','이미지·사진'],['texts','문구·글'],['excluded','포함되지 않는 사항'],['customer_prep','고객님이 준비하실 것'],['schedule','예상 일정'],['revisions','수정 범위'],['extra','기타 확인사항']];
      box.innerHTML = `
        <p class="desc">아래 내용으로 제작 방향을 안내드려요. 확인 후 승인해주시면 디자인 시안 작업을 시작합니다.\n내용 수정이 필요하면 수정요청을 남겨주세요.</p>
        <div id="deliverFiles"></div>
        <div class="brief-box">
          ${BRIEF_LABELS.map(([k,l]) => b[k] ? `<div style="margin-bottom:10px;white-space:pre-line;"><b style="display:block;">${l}</b>${escapeHtml(b[k])}</div>` : '').join('')}
        </div>
        <p class="desc" style="font-size:12.5px;">이 방향서에 적힌 내용이 제작 범위의 기준이에요. 승인해주시면 이 내용대로 진행하고, 승인 후 범위를 벗어나는 변경은 수정 횟수와 추가 비용 기준에 따라요. 다르게 이해하신 부분은 승인 전에 알려주세요.</p>
        <textarea id="requestInput" placeholder="전달할 말씀이나 수정요청 사항이 있으면 적어주세요. 승인하실 때 함께 전달돼요. (없으면 비워두고 바로 승인하셔도 됩니다)"></textarea>
        <div class="btn-row">
          <button class="btn btn-primary" id="approveBtn">위 내용으로 제작을 승인합니다</button>
          <button class="btn btn-ghost" id="requestBtn">수정요청</button>
        </div>
        <div class="msg" id="actionMsg"></div>
      `;
      document.getElementById('approveBtn').addEventListener('click', async ()=>{
        const ab = document.getElementById('approveBtn'); ab.disabled = true;
        const memo = document.getElementById('requestInput').value.trim();
        if(memo){
          const er = await sendStageNote('방향서 승인 시 남긴 메모', memo);
          if(er){ ab.disabled = false; showActionMsg('메모를 전달하지 못했어요. 잠시 후 다시 시도해주세요. (승인은 아직 되지 않았어요)'); return; }
        }
        await sb.from('machim_projects').update({
          direction_approved_at: new Date().toISOString(),
          current_stage: '프로토타입대기'
        }).eq('id', project.id);
        location.href = 'mypage-project.html?id=' + project.id;
      });
      document.getElementById('requestBtn').addEventListener('click', async ()=>{
        const note = document.getElementById('requestInput').value.trim();
        if(!note){ showActionMsg('수정요청 내용을 입력해주세요.'); return; }
        const rb = document.getElementById('requestBtn'); rb.disabled = true;
        const er = await sendStageNote('방향서 수정요청', note);
        rb.disabled = false;
        if(er){ showActionMsg('수정요청을 접수하지 못했어요. 잠시 후 다시 시도해주세요.'); return; }
        document.getElementById('requestInput').value = '';
        showActionMsg('수정요청이 접수됐어요. 확인 후 수정본을 보내드릴게요. 아래 "1:1 문의"에서도 확인할 수 있어요.', true);
      });
    }

    else if(stage === '프로토타입대기'){
      box.innerHTML = `<p class="desc">제작방향이 승인되었습니다.\n디자인 시안(프로토타입)을 준비 중이에요.</p>`;
    }

    else if(stage === '프로토타입승인대기'){
      box.innerHTML = `
        <p class="desc">디자인 시안이 준비됐어요. 아래에서 확인해주세요.</p>
        <div id="deliverFiles"></div>
        ${project.prototype_url ? `<a class="view-link" href="${escapeHtml(normUrl(project.prototype_url))}" target="_blank" rel="noopener">시안 확인하기 →</a>` : ''}
        <textarea id="requestInput" placeholder="전달할 말씀이나 수정요청 사항이 있으면 적어주세요. 승인하실 때 함께 전달돼요. (없으면 비워두고 바로 승인하셔도 됩니다)"></textarea>
        <div class="btn-row">
          <button class="btn btn-primary" id="approveBtn">위 시안으로 제작을 승인합니다</button>
          <button class="btn btn-ghost" id="requestBtn">수정요청</button>
        </div>
        <div class="msg" id="actionMsg"></div>
      `;
      document.getElementById('approveBtn').addEventListener('click', async ()=>{
        const ab = document.getElementById('approveBtn'); ab.disabled = true;
        const memo = document.getElementById('requestInput').value.trim();
        if(memo){
          const er = await sendStageNote('시안 승인 시 남긴 메모', memo);
          if(er){ ab.disabled = false; showActionMsg('메모를 전달하지 못했어요. 잠시 후 다시 시도해주세요. (승인은 아직 되지 않았어요)'); return; }
        }
        await sb.from('machim_projects').update({
          prototype_approved_at: new Date().toISOString(),
          current_stage: '개발중'
        }).eq('id', project.id);
        location.href = 'mypage-project.html?id=' + project.id;
      });
      document.getElementById('requestBtn').addEventListener('click', async ()=>{
        const note = document.getElementById('requestInput').value.trim();
        if(!note){ showActionMsg('수정요청 내용을 입력해주세요.'); return; }
        const rb = document.getElementById('requestBtn'); rb.disabled = true;
        const er = await sendStageNote('시안 수정요청', note);
        rb.disabled = false;
        if(er){ showActionMsg('수정요청을 접수하지 못했어요. 잠시 후 다시 시도해주세요.'); return; }
        document.getElementById('requestInput').value = '';
        showActionMsg('수정요청이 접수됐어요. 확인 후 수정본을 보내드릴게요. 아래 "1:1 문의"에서도 확인할 수 있어요.', true);
      });
    }

    else if(stage === '개발중'){
      box.innerHTML = `<p class="desc">현재 개발 중입니다.\n개발이 끝나면 최종 확인을 요청드릴게요.</p>`;
    }

    else if(stage === '최종확인대기'){
      box.innerHTML = `
        <p class="desc">제작이 완료되었어요. 최종 결과물을 확인해주세요.</p>
        <div id="deliverFiles"></div>
        ${project.final_preview_url ? `<a class="view-link" href="${escapeHtml(normUrl(project.final_preview_url))}" target="_blank" rel="noopener">최종 결과물 확인하기 →</a>` : ''}
        <textarea id="requestInput" placeholder="전달할 말씀이나 수정요청 사항이 있으면 적어주세요. 승인하실 때 함께 전달돼요. (없으면 비워두고 바로 승인하셔도 됩니다)"></textarea>
        <div class="btn-row">
          <button class="btn btn-primary" id="approveBtn">위 내용으로 최종 승인합니다</button>
          <button class="btn btn-ghost" id="requestBtn">수정요청</button>
        </div>
        <div class="msg" id="actionMsg"></div>
      `;
      document.getElementById('approveBtn').addEventListener('click', async ()=>{
        const ab = document.getElementById('approveBtn'); ab.disabled = true;
        const memo = document.getElementById('requestInput').value.trim();
        if(memo){
          const er = await sendStageNote('최종 결과물 승인 시 남긴 메모', memo);
          if(er){ ab.disabled = false; showActionMsg('메모를 전달하지 못했어요. 잠시 후 다시 시도해주세요. (승인은 아직 되지 않았어요)'); return; }
        }
        await sb.from('machim_projects').update({
          final_approved_at: new Date().toISOString(),
          current_stage: '배포완료'
        }).eq('id', project.id);
        location.href = 'mypage-project.html?id=' + project.id;
      });
      document.getElementById('requestBtn').addEventListener('click', async ()=>{
        const note = document.getElementById('requestInput').value.trim();
        if(!note){ showActionMsg('수정요청 내용을 입력해주세요.'); return; }
        const rb = document.getElementById('requestBtn'); rb.disabled = true;
        const er = await sendStageNote('최종 결과물 수정요청', note);
        rb.disabled = false;
        if(er){ showActionMsg('수정요청을 접수하지 못했어요. 잠시 후 다시 시도해주세요.'); return; }
        document.getElementById('requestInput').value = '';
        showActionMsg('수정요청이 접수됐어요. 확인 후 수정본을 보내드릴게요. 아래 "1:1 문의"에서도 확인할 수 있어요.', true);
      });
    }

    else if(stage === '배포완료'){
      box.innerHTML = `
        ${project.deployed_at ? '<p class="desc">배포가 완료되었습니다. 그동안 이용해주셔서 감사합니다!</p>' : '<p class="desc">최종 승인 감사합니다. 지금 사이트를 배포하고 있어요. 배포가 끝나면 사이트 주소와 안내를 여기에 남겨드릴게요.</p>'}
        ${project.live_url ? `<a class="view-link" href="${escapeHtml(normUrl(project.live_url))}" target="_blank" rel="noopener">사이트 바로가기 →</a>` : ''}
        ${project.source_repo_url ? `<div style="font-size:13px;color:var(--ink-soft);">소스코드는 고객님 저장소에 전달했어요: <a class="view-link" href="${escapeHtml(normUrl(project.source_repo_url))}" target="_blank" rel="noopener">${escapeHtml(project.source_repo_url)}</a></div>` : ''}
      `;
    }

    else{
      box.innerHTML = `<p class="desc">지금은 없습니다. 제작이 완료되면 알려드릴게요.</p>`;
    }

    // 마침이 보낸 파일(방향서·시안·최종 결과물) 표시
    const tag = { '방향서승인대기':'방향서', '프로토타입승인대기':'프로토타입', '최종확인대기':'최종' }[stage];
    if(tag) fillDeliverFiles(tag);
  }

  function showActionMsg(text, ok){
    const m = document.getElementById('actionMsg');
    if(!m) return;
    m.textContent = text;
    m.className = 'msg ' + (ok ? 'ok' : 'err');
  }
</script>

</body>
</html>
