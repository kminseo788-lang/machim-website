<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>비밀번호 재설정 | 1마침</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/common.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<style>
  .wrap{width:min(420px, calc(100% - 40px));margin:0 auto;padding:70px 0 100px;}
  .card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:36px 30px;}
  .card h1{font-size:22px;margin-bottom:6px;}
  .card p.sub{color:var(--ink-soft);font-size:13.5px;margin-bottom:22px;}
  input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font:inherit;color:var(--ink);outline:none;margin-bottom:10px;}
  input:focus{border-color:var(--brick);}
  .submit-btn{width:100%;padding:14px;border-radius:10px;background:var(--brick);color:#fff;font-size:15px;font-weight:700;margin-top:4px;display:block;text-align:center;}
  .submit-btn:hover{background:var(--brick-dark);}
  .submit-btn:disabled{opacity:.6;}
  .msg{font-size:13px;margin-top:12px;padding:10px 12px;border-radius:8px;display:none;}
  .msg.err{display:block;background:#FBEAE6;color:var(--brick-dark);}
  .msg.ok{display:block;background:#EAF2EA;color:var(--green);}
</style>
</head>
<body>
<header>
  <div class="nav">
    <a href="index.html" class="logo">1<span class="mark">마침</span></a>
    <a href="mypage-login.html" class="back-link">← 로그인으로</a>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <h1>새 비밀번호 정하기</h1>
    <div id="waiting"><p class="sub">링크를 확인하고 있어요…</p></div>

    <form id="resetForm" style="display:none;">
      <p class="sub">새로 사용할 비밀번호를 입력해주세요.<br>칩북과 같은 계정이라 <b>칩북 로그인 비밀번호도 함께 바뀝니다.</b></p>
      <input type="password" id="pw1" placeholder="새 비밀번호 (6자 이상)" minlength="6" required autocomplete="new-password">
      <input type="password" id="pw2" placeholder="새 비밀번호 확인" minlength="6" required autocomplete="new-password">
      <button type="submit" class="submit-btn" id="saveBtn">비밀번호 변경하기</button>
    </form>

    <div id="doneBox" style="display:none;text-align:center;">
      <p class="sub" style="margin-bottom:18px;">비밀번호가 변경되었어요. 새 비밀번호로 로그인해주세요.</p>
      <a class="submit-btn" href="mypage-login.html">로그인하러 가기</a>
    </div>

    <div id="invalidBox" style="display:none;text-align:center;">
      <p class="sub" style="margin-bottom:18px;">링크가 만료되었거나 이미 사용된 링크예요.<br>로그인 화면에서 비밀번호 재설정 메일을 다시 받아주세요.</p>
      <a class="submit-btn" href="mypage-login.html">로그인 화면으로</a>
    </div>

    <div class="msg" id="msgBox"></div>
  </div>
</div>

<script>
  var ready = false;
  function showForm(){ ready = true; document.getElementById('waiting').style.display='none'; document.getElementById('invalidBox').style.display='none'; document.getElementById('resetForm').style.display='block'; }
  function showMsg(t, ok){ var b = document.getElementById('msgBox'); b.textContent = t; b.className = 'msg ' + (ok?'ok':'err'); b.style.display = 'block'; }

  // 메일 링크로 들어오면 supabase 가 주소의 토큰을 읽어 PASSWORD_RECOVERY 이벤트를 발생시킵니다.
  sb.auth.onAuthStateChange(function(ev, session){ if(ev === 'PASSWORD_RECOVERY' && session){ showForm(); } });
  setTimeout(async function(){
    if(ready) return;
    var s = await sb.auth.getSession();
    if(s.data && s.data.session && /type=recovery/.test(location.hash + location.search)){ showForm(); return; }
    document.getElementById('waiting').style.display = 'none';
    document.getElementById('invalidBox').style.display = 'block';
  }, 2500);

  document.getElementById('resetForm').addEventListener('submit', async function(e){
    e.preventDefault();
    var a = document.getElementById('pw1').value, b = document.getElementById('pw2').value;
    if(a.length < 6){ showMsg('비밀번호는 6자 이상으로 정해주세요.'); return; }
    if(a !== b){ showMsg('두 비밀번호가 서로 달라요. 다시 확인해주세요.'); return; }
    var btn = document.getElementById('saveBtn'); btn.disabled = true; btn.textContent = '변경 중…';
    var r = await sb.auth.updateUser({ password: a });
    if(r.error){
      btn.disabled = false; btn.textContent = '비밀번호 변경하기';
      var m = (r.error.message||'').toLowerCase();
      showMsg(m.includes('different') || m.includes('same') ? '이전과 다른 비밀번호로 정해주세요.' : '변경하지 못했어요: ' + r.error.message);
      return;
    }
    await sb.auth.signOut();
    document.getElementById('resetForm').style.display = 'none';
    document.getElementById('msgBox').style.display = 'none';
    document.getElementById('doneBox').style.display = 'block';
  });
</script>
</body>
</html>
